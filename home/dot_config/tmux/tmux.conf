# ~/.config/tmux/tmux.conf — managed by chezmoi
# (replaces the home-manager-generated tmux config)

# ---- prefix: C-a ----
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ---- general ----
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 1000000
set -g clock-mode-style 24
set -g default-shell /usr/bin/zsh

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Image previews (yazi) need this. tmux normally strips escape sequences it
# doesn't understand, which kills both wezterm's inline-image protocol and the
# capability query yazi uses to detect it — with passthrough off, yazi decides
# the terminal can't do graphics and falls back to the ueberzugpp adapter.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ---- vi copy-mode ----
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- appearance ----
set -g pane-active-border-style "fg=yellow"
set -g status-style "bg=#005f00"
set -g status-position top

# ---- resurrect / continuum ----
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Bring Claude Code back with the session, not just the pane.
#
# resurrect only restores a conservative whitelist of programs, and `claude`
# isn't on it, so a restored pane came back as a bare shell. Two halves here:
#   * the leading `~` relaxes matching to a substring, which is required —
#     resurrect saves the pane's full command from ps, and that is the absolute
#     path (/opt/claude-code/bin/claude), so a bare `claude` would never match.
#     `/bin/claude` is the narrowest substring that still survives the binary
#     moving between /opt, /usr/bin and ~/.local/bin; matching just `claude`
#     would also fire on any pane whose command merely contains the word — an
#     `nvim claude-notes.md` pane, say. It would NOT match an npm-style install,
#     which shows up as `node .../claude-code/cli.js`; widen it if that happens.
#   * `->` replaces the restore command, because re-running the saved path would
#     open an empty session. `--continue` picks up the most recent conversation
#     in the pane's cwd, and resurrect restores cwd before sending this.
#
# Caveat: --continue keys off the directory alone. Two panes in the same repo
# both resume the same (most recent) conversation — /resume in one of them.
set -g @resurrect-processes '"~/bin/claude->claude --continue"'

# ---- plugins (TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Install with prefix + I on first run. TPM lives under the tmux config dir.
run '~/.config/tmux/plugins/tpm/tpm'
