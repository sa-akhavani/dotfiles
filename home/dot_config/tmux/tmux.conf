# ~/.config/tmux/tmux.conf — managed by chezmoi
# (replaces the home-manager-generated tmux config)

# ---- prefix: C-a ----
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ---- general ----
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 1000000
set -g clock-mode-style 24
set -g default-shell /usr/bin/zsh

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Image previews (yazi) need this. tmux normally strips escape sequences it
# doesn't understand, which kills both wezterm's inline-image protocol and the
# capability query yazi uses to detect it — with passthrough off, yazi decides
# the terminal can't do graphics and falls back to the ueberzugpp adapter.
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# ---- vi copy-mode ----
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---- appearance ----
set -g pane-active-border-style "fg=yellow"
set -g status-style "bg=#005f00"
set -g status-position top

# ---- resurrect / continuum ----
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# ---- plugins (TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Install with prefix + I on first run. TPM lives under the tmux config dir.
run '~/.config/tmux/plugins/tpm/tpm'
