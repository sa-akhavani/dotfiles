<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Fall back to Symbols Nerd Font Mono for icon glyphs</description>

  <!--
    This repo installs no patched Nerd Font. Icon glyphs come from the one
    standalone family, ttf-nerd-fonts-symbols-mono, and something has to point
    the rest of the system at it.

    ttf-nerd-fonts-symbols-common already ships upstream's version of this rule
    at /usr/share/fontconfig/conf.avail/10-nerd-font-symbols.conf, but it is
    useless here for two reasons: Arch never symlinks conf.avail into
    /etc/fonts/conf.d, and it aliases to "Symbols Nerd Font" (the proportional
    package, which is not installed) rather than the Mono variant.

    It also uses <prefer>, which puts a font with no Latin glyphs at the FRONT
    of the monospace list — fine for per-glyph shapers like Pango, wrong for
    anything that resolves a family to a single face. Appending with a weak
    binding instead keeps the real font first and only adds Symbols Nerd Font
    Mono after it, which is what a fallback should do.

    WezTerm and Waybar do not need this: WezTerm does its own per-glyph
    fontconfig fallback (and draws the powerline range itself via
    custom_block_glyphs), and waybar/style.css names the family in its stack.
    This covers everything that does neither — mako, GTK apps, anything asking
    for plain "monospace".
  -->

  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>

  <!-- The terminal/editor font, named directly by wezterm.lua and mako/config. -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Fira Code</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>
</fontconfig>
