# hyprpaper 0.8 config format. The OLD format was
#
#     preload   = ~/Pictures/Wallpapers/wall.jpeg
#     wallpaper = , ~/Pictures/Wallpapers/wall.jpeg
#
# and it is gone: `preload` and the top-level `wallpaper =` key no longer exist,
# so hyprpaper started, understood none of the file, and showed no wallpaper at
# all. Wallpapers are now a `wallpaper { }` block keyed on `monitor`.

splash = false

wallpaper {
    # empty monitor = every output
    monitor =
    # a DIRECTORY is allowed here, and together with timeout/order below
    # hyprpaper does the random rotation itself — that used to be what
    # wallpaper-reload.sh was for. `recursive` scans subdirectories.
    path = ~/Pictures/Wallpapers
    recursive = false

    # cover = fill the output and crop the overflow (vs. contain / stretch)
    fit_mode = cover

    # rotate every 15 minutes; 0 would pin a single image
    timeout = 900
    order = random-shuffle
}
