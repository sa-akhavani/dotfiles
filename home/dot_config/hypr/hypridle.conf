$lock_cmd = ~/.config/hypr/scripts/lockscreen.sh
# $suspend_cmd = pidof steam || systemctl suspend || loginctl suspend #nvidia?

general {
    lock_cmd = $lock_cmd  # dbus/sysd lock command (loginctl lock-session)
    before_sleep_cmd = loginctl lock-session  # command ran before sleep
    after_sleep_cmd = notify-send "Awake!"  # command ran after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

# Lock After 5 mins
listener {
    timeout = 300 # second
    # NOTE: a listener supports ONE on-timeout; multiple lines = only the last
    # takes effect. Combined so locking actually happens.
    on-timeout = notify-send "You are idle!" && loginctl lock-session
    on-resume = notify-send "Welcome back!"  # command to run when activity is detected after timeout has fired.
}

# Turn monitors off after 7 mins
#
# `hyprctl dispatch` takes a LUA EXPRESSION now, not hyprlang arguments. Since
# the 0.55 Lua migration it evaluates `return hl.dispatch(<arg>)`, so the old
# `dpms off` is a Lua syntax error — it fails with exit 7 every single time and
# the monitors never blanked at all. hyprlang keeps a value verbatim to the end
# of the line, so the braces and the inner `=` here are safe.
#
# The old on-resume was `hyprctl dispatch dpms on && pkill waybar; waybar &`,
# and that is where the duplicate waybars came from. `&&` binds tighter than
# `;`, so it grouped as `(hyprctl … && pkill waybar) ; (waybar &)`: with the
# hyprctl half always failing, `pkill waybar` was never reached while `waybar &`
# ran unconditionally. Every dpms resume therefore added one more bar.
#
# Two separate fixes, both needed:
#   * `;` instead of `&&`, so restarting the bar can't depend on the exit status
#     of an unrelated command.
#   * reload_waybar.sh instead of an inline pkill. `pkill` only *sends* SIGTERM
#     and returns immediately; the script waits for the process to actually be
#     gone before launching the replacement, which is what stops a new bar from
#     appearing next to a still-dying one. `&` because that script ends in a
#     foreground `waybar` and never returns.
listener {
    timeout = 450
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'; ~/.config/hypr/scripts/reload_waybar.sh &
}

