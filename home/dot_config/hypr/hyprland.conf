# Sourced Configs
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/env_nvidia.conf
source = ~/.config/hypr/monitor.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/workspaces.conf
source = ~/.config/hypr/graphics.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/window_rules.conf
source = ~/.config/hypr/gestures.conf

# Scripts
$wallpaper-reload = ~/.config/hypr/scripts/wallpaper-reload.sh
$lock-script = ~/.config/hypr/scripts/lockscreen.sh
$gtk-script = ~/.config/hypr/scripts/gtk.sh
$dynamic-borders = ~/.config/hypr/scripts/dynamic-borders.sh # https://github.com/devadathanmb/hyprland-smart-borders



# Run fusuma for extra gestures
# exec-once = ydotoold
# exec-once = fusuma

# Authentication Agent Autostart
# exec-once=/usr/lib/polkit-kde-authentication-agent-1

# GTK Theme
# exec-once = $gtk-script

# Dynamic Borders Script
exec-once = $dynamic-borders

# Waybar
exec-once = waybar

# Blue light reduction
exec-once = hyprsunset

# Lock Screen + Idle Time
exec-once = hypridle

# Elephant — walker's data backend. Walker is only a frontend and shows nothing
# at all unless this is already running, so it starts with the session rather
# than on first launch. It also owns the clipboard history now (the `:` prefix,
# bound to $mainMod+V), which is why the two `wl-paste --watch cliphist store`
# lines that used to live here are gone: cliphist and elephant-clipboard would
# each keep their own history and neither would see the other's entries.
exec-once = elephant

# Walker in GApplication service mode. Walker is a GTK4 app, so launching the
# binary per keypress paid for GTK + theme init every time — visibly slow. In
# service mode that cost is paid once here, and the `walker` / `walker -m
# clipboard` binds just activate this instance, which shows up instantly.
# Two consequences: the config and theme CSS are read at startup, so
# `pkill walker; walker --gapplication-service` after editing either one; and
# `close_when_open = true` (walker's default) is what keeps the bind a toggle.
exec-once = walker --gapplication-service

# Break Reminder
# exec-once = ianny

# Wallpaper. hyprpaper picks the first image and rotates on its own now
# (timeout/order in hyprpaper.conf), so $wallpaper-reload is no longer started
# here — it stays bound to Mod+Alt+R in bindings.conf for skipping manually.
exec-once = hyprpaper

