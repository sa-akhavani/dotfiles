# pam_faillock lock-out policy, read by the pam_faillock lines in
# /etc/pam.d/system-auth (so it governs sudo, login, tuigreet and polkit alike).
#
# Arch ships this file fully commented out, i.e. deny=3 / unlock_time=600:
# three mistyped sudo prompts lock the account for ten minutes. sudo does not
# relay pam_faillock's "account locked" message -- it just reprints the password
# prompt -- so the lock-out is indistinguishable from a wrong password, and the
# obvious escape (`sudo faillock --reset`) needs the sudo you just lost.
# Recovery is a root TTY or waiting it out. Hence a roomier deny.
#
# `faillock` with no arguments prints the current tally for your own user.
deny = 5

# Already the upstream default; stated explicitly so the whole policy is
# visible here rather than half of it living in pam's defaults.
unlock_time = 600
