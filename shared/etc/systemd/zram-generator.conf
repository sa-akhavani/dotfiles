# zram-based swap. Installed to /etc/systemd/zram-generator.conf.
#
# The [zram0] section's presence is what makes zram-generator create the device
# at all — settings below are all optional, but the header is not. Deleting this
# file, or the zram-generator package, leaves the host with no swap whatsoever,
# because nothing in this repo configures a swap partition or a swapfile.
#
# zram-size is spelled out rather than left to its default, which is
#   min(ram / 2, 4096)
# — and that 4G ceiling is wrong in both directions across these hosts: it never
# binds on giv (8G RAM, so half is 4G anyway) and it short-changes rostam, whose
# 32G would also get just 4G. Dropping the cap lets this ONE shared file size
# itself correctly per host.
#
# That is deliberately why there is no hosts/<host>/etc override for this path.
# install.sh applies shared/etc first and hosts/<host>/etc second, so a file
# present in both is written twice on every run, never reports "(unchanged)",
# and on the first run backs the shared copy up to .dotfiles-bak — a backup that
# looks like a rescued hand-edit but is only ever the script's own output.
#
# zstd compresses typical anonymous pages roughly 3:1, so half of RAM as zram
# holds appreciably more than half of RAM's worth of pages.
#
# NOTE: zram can never be a hibernation target. Suspend-to-disk needs a real
# swap partition or file, plus resume= / resume_offset= on the kernel command
# line and the `resume` hook in mkinitcpio.conf — /boot and per-machine, so the
# same manual-step category as `quiet loglevel=3` (README installation step 4).
#
# Verify after a reboot with:  swapon --show
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
