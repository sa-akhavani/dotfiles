# zram-based swap. Installed to /etc/systemd/zram-generator.conf.
#
# An empty [zram0] section is not a no-op — the section's presence is what makes
# zram-generator create the device at all, and every setting then falls back to
# its default (size = half of RAM capped at 4G, zstd compression, priority 100).
# Deleting this file, or the zram-generator package, leaves the host with no
# swap whatsoever, because nothing here configures a swap partition or file.
#
# Verify after a reboot with:  swapon --show
[zram0]
